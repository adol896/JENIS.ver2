<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Assistant "Genis" & Multi-Lang SuperChat Overlay</title>
    <style>
      /* ベーススタイル */
      html, body {
          margin: 0; padding: 0; width: 100%; height: 100%;
          background-color: #00FF00; overflow: hidden;
          font-family: 'Helvetica Neue', Arial, sans-serif; color: #ffffff;
      }

      /* スタート案内オーバーレイ */
      #start-overlay {
          position: absolute; top: 0; left: 0; width: 100%; height: 100%;
          background: rgba(0, 0, 0, 0.7); z-index: 100;
          display: flex; justify-content: center; align-items: center;
          cursor: pointer; font-size: 20px; font-weight: bold; color: #00f3ff;
      }

      /* [1] AI Assistant (Genis) UI */
      #assistant-container {
          position: absolute; bottom: 10px; left: 10px;
          display: flex; flex-direction: column; align-items: center; z-index: 80;
          background: transparent !important;
      }
      #avatar-frame {
          width: 360px; height: 180px; overflow: hidden;
          position: relative; background: transparent !important;
          transition: opacity 0.3s ease;
          display: flex; justify-content: center; align-items: center;
      }
      #avatar-orb {
          width: 110px; height: 110px; border-radius: 50%;
          background: radial-gradient(circle at 35% 35%, #ffffff, #00f3ff 45%, #0066ff 75%, #001133 100%);
          box-shadow: 0 0 25px #00f3ff, 0 0 50px rgba(0, 243, 255, 0.6), inset 0 0 15px rgba(255, 255, 255, 0.8);
          position: absolute; top: 45%; left: 50%;
          transform: translate(-50%, -50%) scale(1);
          transition: transform 0.15s ease, box-shadow 0.15s ease;
          animation: orb-idle 3s infinite ease-in-out;
      }
      @keyframes orb-idle {
          0%, 100% {
              transform: translate(-50%, -50%) scale(1);
              box-shadow: 0 0 20px #00f3ff, 0 0 40px rgba(0, 243, 255, 0.5);
          }
          50% {
              transform: translate(-50%, -50%) scale(1.06);
              box-shadow: 0 0 35px #00f3ff, 0 0 60px rgba(0, 243, 255, 0.8);
          }
      }
      #avatar-orb.speaking-pulse {
          transform: translate(-50%, -50%) scale(1.22);
          box-shadow: 0 0 45px #00f3ff, 0 0 85px #00f3ff, inset 0 0 25px #ffffff;
      }
      #ai-status-msg {
          font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px;
          color: rgba(255, 255, 255, 0.7); text-shadow: 0 2px 4px rgba(0,0,0,0.9); margin-top: 4px;
          transition: opacity 0.3s ease;
      }
      .controls-row {
          display: flex; gap: 8px; margin-top: 10px; margin-bottom: 10px;
      }
      .ui-btn {
          background: rgba(15, 20, 35, 0.85); border: 1px solid #00f3ff; color: #00f3ff;
          border-radius: 4px; padding: 6px 12px; font-size: 11px; font-weight: bold;
          letter-spacing: 1px; cursor: pointer; box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
          transition: all 0.2s ease; pointer-events: auto;
      }
      .ui-btn:hover {
          background: #00f3ff; color: #0d1117; box-shadow: 0 0 15px rgba(0, 243, 255, 0.6);
      }
      .element-hide { opacity: 0 !important; pointer-events: none !important; }

      #ai-subtitle-box {
          position: absolute; bottom: 75px; left: 50%; transform: translateX(-50%);
          background: rgba(6, 10, 22, 0.85);
          border-left: 4px solid #00f3ff; border-radius: 0 8px 8px 0;
          padding: 14px 24px; font-size: 24px; font-weight: bold;
          width: 520px; text-align: center; line-height: 1.4;
          box-shadow: 0 8px 24px rgba(0,0,0,0.4);
          opacity: 0; transform: translate(-50%, 10px);
          transition: opacity 0.2s ease-out, transform 0.2s ease-out;
          pointer-events: none; word-break: break-word; z-index: 20;
      }
      #ai-subtitle-box.active { opacity: 1; transform: translate(-50%, 0); }

      /* [2] カットイン・スパチャ演出 UI */
      #phrase-cutin-box {
          position: absolute; top: 45%; left: 50%;
          width: 90%; max-width: 600px; height: 110px;
          display: flex; align-items: center; justify-content: center;
          z-index: 50; pointer-events: none;
          background: repeating-linear-gradient(90deg, #3d2314, #3d2314 4px, #2b180d 4px, #2b180d 8px),
                      linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.4) 100%);
          background-blend-mode: multiply;
          border: 5px solid #1a0f08; border-radius: 4px;
          box-shadow: 0 0 30px #ff6600, 0 0 60px #8000ff, inset 0 0 20px rgba(0, 0, 0, 0.8);
          transform: translate(100vw, -50%) skewX(-10deg); opacity: 0; transition: none;
      }
      #phrase-cutin-box.slide-in {
          opacity: 1; transform: translate(-50%, -50%) skewX(-10deg);
          transition: transform 0.25s cubic-bezier(0.075, 0.82, 0.165, 1), opacity 0.15s ease-out;
      }
      #phrase-cutin-box.slide-out {
          opacity: 0; transform: translate(-150vw, -50%) skewX(-10deg);
          transition: transform 0.2s ease-in, opacity 0.15s ease-in;
      }
      #phrase-text-content {
          font-size: 38px; font-weight: 900; font-family: 'Impact', 'Arial Black', sans-serif;
          letter-spacing: 6px; color: #ff9900; text-shadow: 0 0 8px #000, 0 0 20px #8000ff, 2px 2px 2px #3a0000;
      }

      #sc-popup-box {
          position: absolute; top: 45%; left: 50%;
          transform: translate(-50%, -30%);
          background: linear-gradient(135deg, #ff4e50, #f9d423);
          border: 4px solid #ffffff; border-radius: 16px;
          padding: 14px 28px;
          box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 40px rgba(255, 215, 0, 0.8);
          z-index: 60; pointer-events: none; opacity: 0;
          box-sizing: border-box; max-width: 85%;
          transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s;
      }
      #sc-popup-box.show {
          transform: translate(-50%, -50%); opacity: 1;
      }
      #sc-text-content {
          font-size: 26px; font-weight: 900; color: #ffffff;
          text-shadow: 2px 2px 6px rgba(0,0,0,0.5), 0 0 10px rgba(255,255,255,0.4);
          white-space: nowrap; text-align: center;
      }

      #canvas-confetti {
          position: absolute; top: 0; left: 0;
          width: 100%; height: 100%; z-index: 70; pointer-events: none;
      }
    </style>
    <!-- kuromoji.js -->
    <script src="https://unpkg.com/kuromoji@0.1.2/build/kuromoji.js"></script>
  </head>
  <body>
    <!-- 画面クリック起動用オーバーレイ -->
    <div id="start-overlay">画面をクリックしてマイク・音声を起動してください</div>

    <canvas id="canvas-confetti"></canvas>

    <div id="assistant-container">
      <div id="avatar-frame">
        <div id="avatar-orb"></div>
      </div>
      <div id="ai-status-msg">STANDBY</div>
      <div class="controls-row">
        <button id="toggle-lang-btn" class="ui-btn">LANG: JA</button>
        <button id="toggle-avatar-btn" class="ui-btn">AVATAR HIDE</button>
      </div>
    </div>

    <div id="ai-subtitle-box">...</div>

    <div id="phrase-cutin-box">
      <div id="phrase-text-content"></div>
    </div>

    <div id="sc-popup-box">
      <div id="sc-text-content">ありがとうございます！</div>
    </div>

    <script>
      let tokenizer = null;

      kuromoji.builder({ dicPath: "https://unpkg.com/kuromoji@0.1.2/dict/" }).build((err, _tokenizer) => {
          if (err) {
              console.warn("Kuromoji Load Error (フォールバックで動作します):", err);
              return;
          }
          tokenizer = _tokenizer;
          console.log("Kuromoji 準備完了");
      });

      const botState = {
          currentTopic: "general",
          entities: { lastFood: null, lastGame: null }
      };

      function generateNoBrainResponse(text) {
          if (!tokenizer) {
              if (text.includes("ラーメン") || text.includes("カレー") || text.includes("ご飯")) {
                  return "美味しそうなお話ですね！お腹が空いてきました。";
              }
              return "お話ししてくれてありがとうございます！もっと教えてくださいね。";
          }

          const tokens = tokenizer.tokenize(text);
          let extractedFood = null;
          let extractedGame = null;
          let isPositive = false;

          tokens.forEach(token => {
              const word = token.surface_form;
              const pos = token.pos;

              if (pos === "名詞") {
                  if (["ラーメン", "カレー", "焼肉", "寿司", "パスタ", "アイス", "ケーキ"].some(f => word.includes(f))) {
                      extractedFood = word;
                  }
                  if (["マイクラ", "Apex", "モンハン", "ポケモン", "原神", "Valo"].some(g => word.includes(g))) {
                      extractedGame = word;
                  }
              }
              if (["うまい", "おいしい", "楽しい", "最高", "面白かった", "好き"].some(w => word.includes(w))) {
                  isPositive = true;
              }
          });

          if (extractedFood) {
              botState.currentTopic = "food";
              botState.entities.lastFood = extractedFood;
              return `${extractedFood}ですか！すごく美味しそうですね。最近よく食べているんですか？`;
          }

          if (extractedGame) {
              botState.currentTopic = "game";
              botState.entities.lastGame = extractedGame;
              return `${extractedGame}、良いですね！配信でプレイしているのを見るのが大好きです！`;
          }

          if (isPositive) {
              if (botState.currentTopic === "food" && botState.entities.lastFood) {
                  return `やっぱり${botState.entities.lastFood}は最高ですよね！話を聞いてたらお腹が空いてきました。`;
              }
              if (botState.currentTopic === "game" && botState.entities.lastGame) {
                  return `${botState.entities.lastGame}でそんなに盛り上がれたんですね！聞いてる私まで嬉しくなります！`;
              }
              return "楽しそうで何よりです！私も混ぜてください！";
          }

          return "ふむふむ、なるほど！もっと詳しく教えてもらえますか？";
      }

      const langConfig = {
          ja: {
              recognitionLang: 'ja-JP',
              scDefaultText: "ありがとうございます！",
              scKeywords: ["スパチャ", "スーパーチャット", "ありがとうございまーす", "ありがとうございます", "感謝"],
              cutInRules: [
                  { keywords: ["ここだ"], text: "ここだ！" },
                  { keywords: ["ここで決める", "これで決める"], text: "これで決める！" }
              ]
          },
          en: {
              recognitionLang: 'en-US',
              scDefaultText: "THANK YOU SO MUCH!",
              scKeywords: ["super chat", "superchat", "thank you", "thanks for the support", "thanks"],
              cutInRules: [
                  { keywords: ["this is it", "here goes", "now"], text: "THIS IS IT!" },
                  { keywords: ["finish this", "let's do this", "take this"], text: "LET'S DO THIS!" }
              ]
          }
      };

      const sePlayer = new Audio();
      sePlayer.src = "剣を抜く.mp3";
      sePlayer.volume = 0.5;

      function playSuperChatSynthSE() {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!AudioContext) return;

          const ctx = new AudioContext();
          if (ctx.state === 'suspended') { ctx.resume(); }

          const now = ctx.currentTime;
          const masterGain = ctx.createGain();
          masterGain.gain.setValueAtTime(1.6, now);
          masterGain.connect(ctx.destination);

          const bellFreqs = [523.25, 659.25, 783.99, 1046.5];
          bellFreqs.forEach((freq, index) => {
              const timeOffset = index * 0.05;
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.type = index % 2 === 0 ? 'sine' : 'triangle';
              osc.frequency.setValueAtTime(freq, now + timeOffset);
              osc.frequency.exponentialRampToValueAtTime(freq * 1.2, now + timeOffset + 0.5);
              gain.gain.setValueAtTime(0.35, now + timeOffset);
              gain.gain.exponentialRampToValueAtTime(0.001, now + timeOffset + 0.5);
              osc.connect(gain);
              gain.connect(masterGain);
              osc.start(now + timeOffset);
              osc.stop(now + timeOffset + 0.55);
          });
      }

      let silenceTimer = null;
      const SILENCE_LIMIT = 20 * 1000;

      function resetSilenceTimer() {
          if (silenceTimer) clearTimeout(silenceTimer);
          silenceTimer = setTimeout(triggerSilenceTalk, SILENCE_LIMIT);
      }

      function stopSilenceTimer() {
          if (silenceTimer) clearTimeout(silenceTimer);
      }

      function triggerSilenceTalk() {
          if (isSpeaking) {
              resetSilenceTimer();
              return;
          }
          if (typeof silencePhrases !== 'undefined' && silencePhrases[currentLang] && silencePhrases[currentLang].length > 0) {
              const phrases = silencePhrases[currentLang];
              const selectedText = phrases[Math.floor(Math.random() * phrases.length)];
              runAssistantVoice(selectedText, currentLang);
          }
      }

      function executePhraseCutIn(text) {
          const cutInBox = document.getElementById('phrase-cutin-box');
          const cutInText = document.getElementById('phrase-text-content');
          cutInText.innerText = text;
          cutInBox.classList.remove('slide-in', 'slide-out');
          void cutInBox.offsetWidth;
          cutInBox.classList.add('slide-in');

          setTimeout(() => {
              sePlayer.currentTime = 0;
              sePlayer.play().catch(() => {});
          }, 300);

          setTimeout(() => {
              cutInBox.classList.remove('slide-in');
              cutInBox.classList.add('slide-out');
              setTimeout(() => { cutInBox.classList.remove('slide-out'); }, 300);
          }, 3000);
      }

      function triggerSuperChatEffects() {
          const scBox = document.getElementById('sc-popup-box');
          scBox.classList.add('show');
          fireConfetti();
          setTimeout(() => { playSuperChatSynthSE(); }, 50);
          setTimeout(() => { scBox.classList.remove('show'); }, 4000);
      }

      const canvas = document.getElementById('canvas-confetti');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      let particles = [];
      let animatingConfetti = false;

      function fireConfetti() {
          const colors = ['#ff4e50', '#f9d423', '#00f3ff', '#ffffff', '#ff00ff'];
          particles = [];
          for(let i=0; i<100; i++) {
              particles.push({
                  x: canvas.width / 2, y: canvas.height / 2,
                  r: Math.random() * 6 + 4,
                  dx: Math.random() * 30 - 15, dy: Math.random() * -20 - 10,
                  color: colors[Math.floor(Math.random() * colors.length)],
                  tilt: Math.floor(Math.random() * 10) - 10, tiltAngle: 0,
                  tiltAngleInc: (Math.random() * 0.07) + 0.05
              });
          }
          if(!animatingConfetti) animateConfetti();
      }

      function animateConfetti() {
          animatingConfetti = true;
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          particles.forEach((p, index) => {
              p.tiltAngle += p.tiltAngleInc;
              p.y += (Math.cos(p.tiltAngle) + 1 + p.r / 2) / 2;
              p.x += Math.sin(p.tiltAngle) * 2;
              p.dy += 0.4;
              p.x += p.dx; p.y += p.dy;
              ctx.beginPath();
              ctx.lineWidth = p.r; ctx.strokeStyle = p.color;
              ctx.moveTo(p.x + p.tilt + p.r, p.y);
              ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r);
              ctx.stroke();
              if(p.y > canvas.height) particles.splice(index, 1);
          });
          if(particles.length > 0) requestAnimationFrame(animateConfetti);
          else { animatingConfetti = false; ctx.clearRect(0, 0, canvas.width, canvas.height); }
      }

      let isSpeaking = false;
      let currentLang = 'ja';
      const synthesizer = window.speechSynthesis;

      const avatarOrb = document.getElementById('avatar-orb');
      const aiStatusMsg = document.getElementById('ai-status-msg');
      const aiSubtitleBox = document.getElementById('ai-subtitle-box');
      const toggleBtn = document.getElementById('toggle-avatar-btn');
      const toggleLangBtn = document.getElementById('toggle-lang-btn');
      const avatarFrame = document.getElementById('avatar-frame');
      let orbPulseInterval = null;

      toggleLangBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          currentLang = (currentLang === 'ja') ? 'en' : 'ja';
          toggleLangBtn.innerText = `LANG: ${currentLang.toUpperCase()}`;
          document.getElementById('sc-text-content').innerText = langConfig[currentLang].scDefaultText;
          updateSpeechRecognitionLang();
      });

      toggleBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          const isHidden = avatarFrame.classList.toggle('element-hide');
          aiStatusMsg.classList.toggle('element-hide');
          toggleBtn.innerText = isHidden ? "AVATAR SHOW" : "AVATAR HIDE";
      });

      function updateAvatarState() {
          clearInterval(orbPulseInterval);
          if (isSpeaking) {
              let isHighGlow = false;
              orbPulseInterval = setInterval(() => {
                  isHighGlow = !isHighGlow;
                  avatarOrb.classList.toggle('speaking-pulse', isHighGlow);
              }, 160);
          } else {
              avatarOrb.classList.remove('speaking-pulse');
          }
      }

      function runAssistantVoice(fullText, lang) {
          if (synthesizer.speaking) synthesizer.cancel();
          const utterance = new SpeechSynthesisUtterance(fullText);
          utterance.lang = (lang === 'en') ? 'en-US' : 'ja-JP';

          utterance.onstart = () => {
              isSpeaking = true;
              stopSilenceTimer();
              updateAvatarState();
              aiStatusMsg.innerText = "TALKING";
              aiSubtitleBox.innerText = fullText;
              aiSubtitleBox.classList.add('active');
          };

          utterance.onend = () => {
              isSpeaking = false;
              resetSilenceTimer();
              updateAvatarState();
              aiStatusMsg.innerText = "STANDBY";
              aiSubtitleBox.classList.remove('active');
          };

          synthesizer.speak(utterance);
      }

      let isRecognitionActive = false;
      let voiceRecognition = null;
      const WebKitSpeech = window.SpeechRecognition || window.webkitSpeechRecognition;

      if (WebKitSpeech) {
          voiceRecognition = new WebKitSpeech();
          voiceRecognition.continuous = true;
          voiceRecognition.interimResults = false;

          voiceRecognition.onstart = () => { isRecognitionActive = true; };
          voiceRecognition.onend = () => {
              isRecognitionActive = false;
              setTimeout(safeStartRecognition, 1000);
          };
          voiceRecognition.onerror = () => { isRecognitionActive = false; };

          voiceRecognition.onresult = (event) => {
              if (isSpeaking) return;
              resetSilenceTimer();

              const currentIndex = event.resultIndex;
              const heardPhrase = event.results[currentIndex][0].transcript.trim().toLowerCase();
              const config = langConfig[currentLang];

              if (config.scKeywords.some(kw => heardPhrase.includes(kw.toLowerCase()))) {
                  triggerSuperChatEffects();
                  return;
              }

              for (const rule of config.cutInRules) {
                  if (rule.keywords.some(kw => heardPhrase.includes(kw.toLowerCase()))) {
                      executePhraseCutIn(rule.text);
                      return;
                  }
              }

              const aiResponse = generateNoBrainResponse(heardPhrase);
              runAssistantVoice(aiResponse, currentLang);
          };
      }

      function safeStartRecognition() {
          if (voiceRecognition && !isRecognitionActive) {
              try { voiceRecognition.start(); } catch (e) {}
          }
      }

      function updateSpeechRecognitionLang() {
          if (!voiceRecognition) return;
          if (isRecognitionActive) { voiceRecognition.stop(); }
          voiceRecognition.lang = langConfig[currentLang].recognitionLang;
          safeStartRecognition();
      }

      // 初回画面クリックでブラウザの自動再生・マイク制限を解除
      document.getElementById('start-overlay').addEventListener('click', (e) => {
          e.target.style.display = 'none';
          safeStartRecognition();
          resetSilenceTimer();
      });
    </script>
  </body>
</html>
