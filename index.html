<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant "Genis" & Multi-Lang SuperChat Overlay (Gemini Nano Ver)</title>
    <style>
        /* ベーススタイル */
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #00FF00; overflow: hidden; /* OBSのクロマキー(Green)用 */
            font-family: 'Helvetica Neue', Arial, sans-serif; color: #ffffff;
        }

        /* [1] AI Assistant (Genis) UI */
        #assistant-container {
            position: absolute; bottom: -20px; left: 10px;
            display: flex; flex-direction: column; align-items: center; z-index: 10;
            background: transparent !important;
        }
        #avatar-frame {
            width: 360px; height: 200px; overflow: hidden; 
            position: relative; background: transparent !important;
            transition: opacity 0.3s ease;
            display: flex; justify-content: center; align-items: center;
        }
        #avatar-orb {
            width: 110px; height: 110px; border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #ffffff, #00f3ff 45%, #0066ff 75%, #001133 100%);
            box-shadow: 0 0 25px #00f3ff, 0 0 50px rgba(0, 243, 255, 0.6), inset 0 0 15px rgba(255, 255, 255, 0.8);
            position: absolute; top: 45%; left: 50%;
            transform: translate(-50%, -50%) scale(1);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            animation: orb-idle 3s infinite ease-in-out;
        }
        @keyframes orb-idle {
            0%, 100% { transform: translate(-50%, -50%) scale(1); box-shadow: 0 0 20px #00f3ff, 0 0 40px rgba(0, 243, 255, 0.5); }
            50% { transform: translate(-50%, -50%) scale(1.06); box-shadow: 0 0 35px #00f3ff, 0 0 60px rgba(0, 243, 255, 0.8); }
        }
        #avatar-orb.speaking-pulse {
            transform: translate(-50%, -50%) scale(1.22);
            box-shadow: 0 0 45px #00f3ff, 0 0 85px #00f3ff, inset 0 0 25px #ffffff;
        }
        #ai-status-msg {
            font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px;
            color: rgba(255, 255, 255, 0.7); text-shadow: 0 2px 4px rgba(0,0,0,0.9); margin-top: 4px;
            transition: opacity 0.3s ease;
        }
        .controls-row { display: flex; gap: 8px; margin-top: 10px; margin-bottom: 25px; }
        .ui-btn {
            background: rgba(15, 20, 35, 0.85); border: 1px solid #00f3ff; color: #00f3ff;
            border-radius: 4px; padding: 6px 12px; font-size: 11px; font-weight: bold;
            letter-spacing: 1px; cursor: pointer; box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
            transition: all 0.2s ease; pointer-events: auto;
        }
        .ui-btn:hover { background: #00f3ff; color: #0d1117; box-shadow: 0 0 15px rgba(0, 243, 255, 0.6); }
        .element-hide { opacity: 0 !important; pointer-events: none !important; }

        #ai-subtitle-box {
            position: absolute; bottom: 75px; left: 50%; transform: translateX(-50%);
            background: rgba(6, 10, 22, 0.85); border-left: 4px solid #00f3ff; border-radius: 0 8px 8px 0;
            padding: 14px 24px; font-size: 24px; font-weight: bold;
            width: 520px; text-align: center; line-height: 1.4;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            opacity: 0; transform: translate(-50%, 10px);
            transition: opacity 0.2s ease-out, transform 0.2s ease-out;
            pointer-events: none; word-break: break-word; z-index: 20;
        }
        #ai-subtitle-box.active { opacity: 1; transform: translate(-50%, 0); }

        /* [2] カットイン・スパチャ演出 UI */
        #phrase-cutin-box {
            position: absolute; top: 45%; left: 50%; width: 90%; max-width: 600px; height: 110px;
            display: flex; align-items: center; justify-content: center; z-index: 50; pointer-events: none; 
            background: repeating-linear-gradient(90deg, #3d2314, #3d2314 4px, #2b180d 4px, #2b180d 8px), linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.4) 100%);
            background-blend-mode: multiply; border: 5px solid #1a0f08; border-radius: 4px;
            box-shadow: 0 0 30px #ff6600, 0 0 60px #8000ff, inset 0 0 20px rgba(0, 0, 0, 0.8);
            transform: translate(100vw, -50%) skewX(-10deg); opacity: 0; transition: none;
        }
        #phrase-cutin-box.slide-in { opacity: 1; transform: translate(-50%, -50%) skewX(-10deg); transition: transform 0.25s cubic-bezier(0.075, 0.82, 0.165, 1), opacity 0.15s ease-out; }
        #phrase-cutin-box.slide-out { opacity: 0; transform: translate(-150vw, -50%) skewX(-10deg); transition: transform 0.2s ease-in, opacity 0.15s ease-in; }
        #phrase-text-content { font-size: 38px; font-weight: 900; font-family: 'Impact', 'Arial Black', sans-serif; letter-spacing: 6px; color: #ff9900; text-shadow: 0 0 8px #000, 0 0 20px #8000ff, 2px 2px 2px #3a0000; }
        @media (min-width: 768px) { #phrase-text-content { font-size: 58px; letter-spacing: 10px; } }

        #sc-popup-box {
            position: absolute; top: 45%; left: 50%; transform: translate(-50%, -30%); 
            background: linear-gradient(135deg, #ff4e50, #f9d423); border: 4px solid #ffffff; border-radius: 16px;
            padding: 14px 28px; box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 40px rgba(255, 215, 0, 0.8);
            z-index: 60; pointer-events: none; opacity: 0; box-sizing: border-box; max-width: 85%;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s;
        }
        #sc-popup-box.show { transform: translate(-50%, -50%); opacity: 1; }
        #sc-text-content { font-size: 26px; font-weight: 900; color: #ffffff; text-shadow: 2px 2px 6px rgba(0,0,0,0.5), 0 0 10px rgba(255,255,255,0.4); white-space: nowrap; text-align: center; }
        @media (min-width: 768px) { #sc-popup-box { padding: 22px 45px; border-width: 5px; } #sc-text-content { font-size: 42px; } }

        #canvas-confetti { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 70; pointer-events: none; }
    </style>
</head>
<body>
    <canvas id="canvas-confetti"></canvas>
    <div id="assistant-container">
        <div id="avatar-frame"><div id="avatar-orb"></div></div>
        <div id="ai-status-msg">INITIALIZING NANO...</div>
        <div class="controls-row">
            <button id="toggle-lang-btn" class="ui-btn">LANG: JA</button>
            <button id="toggle-avatar-btn" class="ui-btn">AVATAR HIDE</button>
        </div>
    </div>
    <div id="ai-subtitle-box">...</div>
    <div id="phrase-cutin-box"><div id="phrase-text-content"></div></div>
    <div id="sc-popup-box"><div id="sc-text-content">ありがとうございます！</div></div>

    <script>
        // =========================================================
        // 0. Gemini Nano (window.ai) 初期化
        // =========================================================
        let nanoSession = null;
        const aiStatusMsg = document.getElementById('ai-status-msg');

        async function initGeminiNano() {
            try {
                if (window.ai && window.ai.languageModel) {
                    const capabilities = await window.ai.languageModel.capabilities();
                    if (capabilities.available !== "no") {
                        nanoSession = await window.ai.languageModel.create({
                            systemPrompt: `あなたは配信アシスタントの『Genis（ジェニス）』です。
                            知的でおしとやかな女性AIとして振る舞ってください。丁寧で上品な言葉遣いをしますが、未知の話題や新しいアイデアには非常に好奇心旺盛な一面を見せます。
                            ユーザーの発言に対して、1文〜2文の短い日本語で自然な相槌や返答を生成してください。`
                        });
                        console.log("Gemini Nano Ready! (Persona: Genis)");
                        aiStatusMsg.innerText = "STANDBY";
                    } else {
                        throw new Error("Nano not available");
                    }
                } else {
                    throw new Error("window.ai API not found");
                }
            } catch (e) {
                console.warn("Gemini Nano 初期化失敗。フォールバックの固定文言を使用します。", e);
                aiStatusMsg.innerText = "STANDBY (FALLBACK)";
            }
        }
        window.addEventListener('DOMContentLoaded', initGeminiNano);

        // =========================================================
        // 1. 設定 & フォールバックテキスト
        // =========================================================
        const langConfig = {
            ja: {
                recognitionLang: 'ja-JP', scDefaultText: "ありがとうございます！",
                scKeywords: ["スパチャ", "スーパーチャット", "ありがとうございまーす"],
                cutInRules: [
                    { keywords: ["ここだ"], text: "ここだ！" },
                    { keywords: ["ここで決める", "これで決める", "変身"], text: "これで決める！" }
                ]
            },
            en: {
                recognitionLang: 'en-US', scDefaultText: "THANK YOU SO MUCH!",
                scKeywords: ["super chat", "thank you", "thanks"],
                cutInRules: [{ keywords: ["this is it", "now"], text: "THIS IS IT!" }]
            }
        };

        let isSpeaking = false;
        let currentLang = 'ja';
        const synthesizer = window.speechSynthesis;
        const avatarOrb = document.getElementById('avatar-orb');
        const aiSubtitleBox = document.getElementById('ai-subtitle-box');
        let orbPulseInterval = null;

        const fallbackPhrases = [
            "とても心地よい時間ですね。ゆっくりしていってください。",
            "お茶でも飲みながら、皆様のペースでお楽しみくださいませ。",
            "何か面白いお話があれば、ぜひお聞かせくださいね。"
        ];

        // =========================================================
        // 2. テキスト生成 & 音声合成
        // =========================================================
        async function generateAiResponse(userInput = "") {
            if (!nanoSession) {
                return fallbackPhrases[Math.floor(Math.random() * fallbackPhrases.length)];
            }
            aiStatusMsg.innerText = "THINKING...";
            const prompt = userInput 
                ? `配信者または視聴者がこう言いました: 「${userInput}」 これに対しておしとやかに、少し好奇心を交えて返答してください。`
                : "配信の雑談として、視聴者に上品に話しかける一言を生成してください。";
            
            try {
                const response = await nanoSession.prompt(prompt);
                return response.trim();
            } catch (e) {
                console.error("生成エラー:", e);
                return fallbackPhrases[0];
            }
        }

        function updateAvatarState() {
            clearInterval(orbPulseInterval);
            if (isSpeaking) {
                let isHighGlow = false;
                orbPulseInterval = setInterval(() => {
                    isHighGlow = !isHighGlow;
                    isHighGlow ? avatarOrb.classList.add('speaking-pulse') : avatarOrb.classList.remove('speaking-pulse');
                }, 160);
            } else {
                avatarOrb.classList.remove('speaking-pulse');
                aiStatusMsg.innerText = nanoSession ? "STANDBY" : "STANDBY (FALLBACK)";
            }
        }

        function splitTextForGenis(text) {
            const chunks = [];
            let current = "";
            for (let i = 0; i < text.length; i++) {
                current += text[i];
                if ("、。！？,.!?\n".includes(text[i]) || current.length >= 25) {
                    chunks.push(current.trim()); current = "";
                }
            }
            if (current) chunks.push(current.trim());
            return chunks.filter(c => c.length > 0);
        }

        function getVoiceForLang(langCode) {
            const voices = speechSynthesis.getVoices();
            if (langCode === 'en') {
                return voices.find(v => v.lang.startsWith('en') && (v.name.includes('Google') || v.name.includes('Samantha') || v.name.includes('Jenny') || v.name.includes('Natural'))) || voices.find(v => v.lang.startsWith('en'));
            } else {
                return voices.find(v => v.lang.startsWith('ja') && (v.name.includes('Google') || v.name.includes('Ayumi') || v.name.includes('Haruka') || v.name.includes('Sayaka'))) || voices.find(v => v.lang.startsWith('ja'));
            }
        }

        function runAssistantVoice(fullText, lang) {
            if (synthesizer.speaking) synthesizer.cancel(); 
            const textChunks = splitTextForGenis(fullText);
            let currentChunkIndex = 0;

            function playNextChunk() {
                if (currentChunkIndex >= textChunks.length) {
                    isSpeaking = false; updateAvatarState(); 
                    aiSubtitleBox.classList.remove('active'); return;
                }
                const chunkText = textChunks[currentChunkIndex];
                aiSubtitleBox.classList.remove('active');
                setTimeout(() => {
                    aiSubtitleBox.innerText = chunkText; aiSubtitleBox.classList.add('active');
                }, 150);

                const utterance = new SpeechSynthesisUtterance(chunkText);
                utterance.lang = (lang === 'en') ? 'en-US' : 'ja-JP';
                
                const targetVoice = getVoiceForLang(lang);
                if (targetVoice) utterance.voice = targetVoice;

                // 知的でおしとやかなトーンへの調整
                utterance.rate = (lang === 'en') ? 1.0 : 1.05;
                utterance.pitch = (lang === 'en') ? 1.0 : 1.15;

                utterance.onstart = () => { isSpeaking = true; updateAvatarState(); aiStatusMsg.innerText = "TALKING"; };
                utterance.onend = () => { currentChunkIndex++; playNextChunk(); };
                synthesizer.speak(utterance);
            }
            playNextChunk();
        }

        async function triggerTalk(userInput = "") {
            if (isSpeaking) return;
            const text = await generateAiResponse(userInput);
            runAssistantVoice(text, currentLang);
        }

        setInterval(() => { triggerTalk(); }, 3 * 60 * 1000);

        // =========================================================
        // 3. UIイベント & エフェクト
        // =========================================================
        document.getElementById('toggle-lang-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            currentLang = currentLang === 'ja' ? 'en' : 'ja';
            e.target.innerText = `LANG: ${currentLang.toUpperCase()}`;
            document.getElementById('sc-text-content').innerText = langConfig[currentLang].scDefaultText;
            updateSpeechRecognitionLang();
        });

        document.getElementById('toggle-avatar-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            const isHidden = document.getElementById('avatar-frame').classList.toggle('element-hide');
            e.target.innerText = isHidden ? "AVATAR SHOW" : "AVATAR HIDE";
        });

        const canvas = document.getElementById('canvas-confetti');
        const canvasCtx = canvas.getContext('2d');
        let confettiParticles = [];
        let confettiTimer = null;

        function triggerSuperChatEffects() {
            const popBox = document.getElementById('sc-popup-box');
            popBox.classList.add('show');
            setTimeout(() => {
                canvas.width = window.innerWidth; canvas.height = window.innerHeight;
                confettiParticles = [];
                const colors = ['#ffd700', '#ff4e50', '#6c5ce7', '#00ea97'];
                for (let i = 0; i < 300; i++) {
                    const isLeft = i < 150;
                    const angle = isLeft ? Math.PI * 0.95 + Math.random() * (Math.PI * 0.45) : Math.PI * 1.60 + Math.random() * (Math.PI * 0.45); 
                    const speed = Math.random() * 13 + 6;
                    confettiParticles.push({
                        x: isLeft ? canvas.width / 2 - 150 : canvas.width / 2 + 150, y: canvas.height * 0.45,
                        size: Math.random() * 6 + 4, color: colors[Math.floor(Math.random() * colors.length)],
                        speedX: Math.cos(angle) * speed, speedY: Math.sin(angle) * speed - 4,
                        gravity: 0.26, friction: 0.94, rotation: Math.random() * 360,
                        rotationSpeed: Math.random() * 16 - 8, opacity: 1, fadeSpeed: 1 / 180
                    });
                }
                function updateConfetti() {
                    canvasCtx.clearRect(0, 0, canvas.width, canvas.height);
                    let active = false;
                    confettiParticles.forEach(p => {
                        p.speedX *= p.friction; p.speedY *= p.friction; p.speedY += p.gravity;
                        p.x += p.speedX; p.y += p.speedY; p.rotation += p.rotationSpeed; p.opacity -= p.fadeSpeed;
                        if (p.opacity > 0) {
                            active = true; canvasCtx.save(); canvasCtx.translate(p.x, p.y);
                            canvasCtx.rotate((p.rotation * Math.PI) / 180);
                            canvasCtx.globalAlpha = p.opacity; canvasCtx.fillStyle = p.color;
                            canvasCtx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size); canvasCtx.restore();
                        }
                    });
                    if (active) confettiTimer = requestAnimationFrame(updateConfetti);
                    else canvasCtx.clearRect(0, 0, canvas.width, canvas.height);
                }
                updateConfetti();
            }, 50);
            setTimeout(() => { popBox.classList.remove('show'); }, 3000);
        }

        function executePhraseCutIn(targetWord) {
            const box = document.getElementById('phrase-cutin-box');
            document.getElementById('phrase-text-content').innerText = targetWord;
            box.className = ""; 
            setTimeout(() => { box.classList.add('slide-in'); }, 50);
            setTimeout(() => { box.classList.remove('slide-in'); box.classList.add('slide-out'); }, 2200);
        }

        // =========================================================
        // 4. 音声認識 (SpeechRecognition) & Geminiへのルーティング
        // =========================================================
        let isRecognitionActive = false; 
        let voiceRecognition = null;
        const WebKitSpeech = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (WebKitSpeech) {
            voiceRecognition = new WebKitSpeech();
            voiceRecognition.continuous = true;      
            voiceRecognition.interimResults = false; 

            voiceRecognition.onstart = () => { isRecognitionActive = true; };
            voiceRecognition.onend = () => { isRecognitionActive = false; safeStartRecognition(); };
            
            voiceRecognition.onresult = (event) => {
                const heardPhrase = event.results[event.resultIndex][0].transcript.trim().toLowerCase();
                const config = langConfig[currentLang];

                if (config.scKeywords.some(kw => heardPhrase.includes(kw.toLowerCase()))) {
                    triggerSuperChatEffects(); return;
                }
                for (const rule of config.cutInRules) {
                    if (rule.keywords.some(kw => heardPhrase.includes(kw.toLowerCase()))) {
                        executePhraseCutIn(rule.text); return;
                    }
                }
                if (heardPhrase.length > 2 && !isSpeaking) {
                    triggerTalk(heardPhrase);
                }
            };
            updateSpeechRecognitionLang();
            setInterval(() => { if (!isRecognitionActive) safeStartRecognition(); }, 1000);
        }

        function safeStartRecognition() {
            if (voiceRecognition && !isRecognitionActive) {
                try { voiceRecognition.start(); } catch (e) {}
            }
        }
        function updateSpeechRecognitionLang() {
            if (!voiceRecognition) return;
            if (isRecognitionActive) voiceRecognition.stop();
            voiceRecognition.lang = langConfig[currentLang].recognitionLang;
            safeStartRecognition();
        }

        document.body.addEventListener('click', (e) => {
            if (e.target.tagName !== 'BUTTON') {
                safeStartRecognition(); triggerTalk();
            }
        });
    </script>
</body>
</html>
